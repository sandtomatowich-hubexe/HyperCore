name: Kernel Builder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    # The form lists inputs in the order written here. Labels carry a group tag so the long list scans
    # at a glance: [Run] [Kernel] [Variant] [Feature] [zram]. Keys are unchanged, so existing
    # `gh workflow run -f KEY=value` calls and the README keep working.
    inputs:
      # ---- Run ---------------------------------------------------------------------------------------
      TODO:
        description: "[Run] Output: kernel zips, or only the defconfig"
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      TEST:
        description: "[Run] Dry run: skip the compile, make placeholder zips"
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      CLEAN_LTO_CACHE:
        description: "[Run] Clean the ThinLTO cache (fixes the .config bug)"
        type: boolean
        default: true

      # ---- Kernel ------------------------------------------------------------------------------------
      KERNEL_VERSION:
        description: "[Kernel] GKI LTS line"
        default: "6.1"
        type: choice
        options:
          - "6.1"
          - "5.10"
          - "5.15"
          - "6.6"
          - "6.12"
          - "All"

      KERNEL_SOURCE:
        description: "[Kernel] Source id from sources.json (empty = default)"
        default: ""
        type: string

      KERNEL_EXACT_VERSION:
        description: "[Kernel] Exact version or commit (empty = latest)"
        default: ""
        type: string

      ALLOW_UNVERIFIED:
        description: "[Kernel] Allow a source not verified for the device"
        type: boolean
        default: false

      LTO:
        description: "[Kernel] LTO mode"
        default: "fullLTO"
        type: choice
        options:
          - "fullLTO"
          - "thinLTO"
          - "noneLTO"

      # ---- Variants ----------------------------------------------------------------------------------
      BUILD_VANILLA:
        description: "[Variant] Vanilla (no root)"
        type: boolean
        default: true

      BUILD_KSU:
        description: "[Variant] KernelSU"
        type: boolean
        default: true

      BUILD_KSU_SUSFS:
        description: "[Variant] KernelSU + BakaSU with SUSFS"
        type: boolean
        default: true

      BUILD_KSUN_SUSFS:
        description: "[Variant] KernelSU-Next + SUSFS"
        type: boolean
        default: false

      BUILD_SKSU_SUSFS:
        description: "[Variant] SukiSU + SUSFS"
        type: boolean
        default: false

      BUILD_FINA_SUSFS:
        description: "[Variant] FinaSU + SUSFS"
        type: boolean
        default: false

      BUILD_KOWSU:
        description: "[Variant] KowSU (this fork has no SUSFS)"
        type: boolean
        default: false

      BUILD_RKSU_SUSFS:
        description: "[Variant] RKSU + SUSFS (needs RKSU_REPO variable)"
        type: boolean
        default: false

      BUILD_MAMBO_SUSFS:
        description: "[Variant] MamboSU + SUSFS (needs MAMBOSU_REPO variable)"
        type: boolean
        default: false

      MM:
        description: "[Variant] Multi-manager signatures (BakaSU, KSU-Next)"
        type: boolean
        default: true

      # ---- Features ----------------------------------------------------------------------------------
      DROIDSPACES:
        description: "[Feature] DroidSpaces"
        type: boolean
        default: true

      NH:
        description: "[Feature] NetHunter"
        type: boolean
        default: true

      NM:
        description: "[Feature] NoMount"
        type: boolean
        default: false

      REKERNEL:
        description: "[Feature] Re:Kernel"
        type: boolean
        default: false

      ZSTD:
        description: "[zram] LZ4 + ZSTD"
        type: boolean
        default: false

      LZ4KD:
        description: "[zram] LZ4KD (LZ4 upgrade + NEON)"
        type: boolean
        default: false

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive
  # Repository variables that replace the kernel source of sources.json. Workflow level, so the first job (source
  # gate) and every build job see the same values.
  KERNEL_REPO: ${{ vars.KERNEL_REPO }}
  KERNEL_BRANCH: ${{ vars.KERNEL_BRANCH }}
  KERNEL_BRANCH_NH: ${{ vars.KERNEL_BRANCH_NH }}
  KERNEL_REPO_5_10: ${{ vars.KERNEL_REPO_5_10 }}
  KERNEL_BRANCH_5_10: ${{ vars.KERNEL_BRANCH_5_10 }}
  KERNEL_REPO_5_15: ${{ vars.KERNEL_REPO_5_15 }}
  KERNEL_BRANCH_5_15: ${{ vars.KERNEL_BRANCH_5_15 }}
  KERNEL_REPO_6_1: ${{ vars.KERNEL_REPO_6_1 }}
  KERNEL_BRANCH_6_1: ${{ vars.KERNEL_BRANCH_6_1 }}
  KERNEL_REPO_6_6: ${{ vars.KERNEL_REPO_6_6 }}
  KERNEL_BRANCH_6_6: ${{ vars.KERNEL_BRANCH_6_6 }}
  KERNEL_REPO_6_12: ${{ vars.KERNEL_REPO_6_12 }}
  KERNEL_BRANCH_6_12: ${{ vars.KERNEL_BRANCH_6_12 }}

jobs:
  ensure-cache-release:
    name: Ensure ccache release exists
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Create persistent cache release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view ci-ccache-store --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ci-ccache-store already exists"
          else
            echo "Creating ci-ccache-store release"
            gh release create ci-ccache-store \
              --repo "${{ github.repository }}" \
              --title "CI ccache store (internal - do not delete)" \
              --notes "Persistent compiler cache used by the build workflow. Each build matrix entry keeps one asset here (ccache-<variant>.tar.zst). Safe to delete if you want to force a cold cache for everything; the workflow recreates this release and rebuilds the caches automatically, just slower for the next run per variant." \
              --prerelease \
              --latest=false
          fi

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Validate inputs and select sources
        id: gate
        env:
          KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
          KERNEL_SOURCE: ${{ github.event.inputs.KERNEL_SOURCE }}
          KERNEL_EXACT_VERSION: ${{ github.event.inputs.KERNEL_EXACT_VERSION }}
          ALLOW_UNVERIFIED: ${{ github.event.inputs.ALLOW_UNVERIFIED }}
          HYPERCORE_DEVICE: ${{ vars.HYPERCORE_DEVICE }}
          NH: ${{ github.event.inputs.NH }}
          BUILD_RKSU_SUSFS: ${{ github.event.inputs.BUILD_RKSU_SUSFS }}
          BUILD_MAMBO_SUSFS: ${{ github.event.inputs.BUILD_MAMBO_SUSFS }}
          RKSU_REPO: ${{ vars.RKSU_REPO }}
          MAMBOSU_REPO: ${{ vars.MAMBOSU_REPO }}
        run: |
          # Fail here, once, instead of in every build job after the kernel has been cloned
          set -euo pipefail
          python3 py/sources.py validate
          python3 py/kernelver.py "$KERNEL_VERSION" "$KERNEL_EXACT_VERSION" --gha
          if [ "$BUILD_RKSU_SUSFS" = "true" ] && [ -z "$RKSU_REPO" ]; then
            echo "::error::RKSU is selected but the RKSU_REPO repository variable is empty. Set it to owner/repository."
            exit 1
          fi
          if [ "$BUILD_MAMBO_SUSFS" = "true" ] && [ -z "$MAMBOSU_REPO" ]; then
            echo "::error::MamboSU is selected but the MAMBOSU_REPO repository variable is empty. Set it to owner/repository."
            exit 1
          fi

          # Which kernel lines may be built for this device, and with which source. Blocks unsupported sources and
          # explicit unverified ones before any build job starts.
          source ./functions.sh
          source ./functions-extra.sh
          custom="$(overridden_lines)"
          lines="$(python3 py/sources.py gate --kernel-version "$KERNEL_VERSION" --source "$KERNEL_SOURCE" \
            ${HYPERCORE_DEVICE:+--device "$HYPERCORE_DEVICE"} --allow-unverified "$ALLOW_UNVERIFIED" \
            --custom-lines "$custom" --gha)"
          echo "lines=$lines" >> "$GITHUB_OUTPUT"

          # A pinned version or commit must exist in the selected source. Checked once here with a commit-only clone,
          # instead of in every build job after the full clone.
          if [ -n "$KERNEL_EXACT_VERSION" ]; then
            if ! out="$(preflight_pin 2>&1)"; then
              echo "::error::$(printf '%s' "$out" | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' ' ')"
              exit 1
            fi
            printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g'
          fi

      - name: Generate build matrix
        id: set-matrix
        env:
          ALLOWED_LINES: ${{ steps.gate.outputs.lines }}
          DROIDSPACES: ${{ github.event.inputs.DROIDSPACES }}
          KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
          KERNEL_EXACT_VERSION: ${{ github.event.inputs.KERNEL_EXACT_VERSION }}
          BUILD_VANILLA: ${{ github.event.inputs.BUILD_VANILLA }}
          BUILD_KSU: ${{ github.event.inputs.BUILD_KSU }}
          BUILD_KSU_SUSFS: ${{ github.event.inputs.BUILD_KSU_SUSFS }}
          BUILD_KSUN_SUSFS: ${{ github.event.inputs.BUILD_KSUN_SUSFS }}
          BUILD_FINA_SUSFS: ${{ github.event.inputs.BUILD_FINA_SUSFS }}
          BUILD_SKSU_SUSFS: ${{ github.event.inputs.BUILD_SKSU_SUSFS }}
          BUILD_KOWSU: ${{ github.event.inputs.BUILD_KOWSU }}
          BUILD_RKSU_SUSFS: ${{ github.event.inputs.BUILD_RKSU_SUSFS }}
          BUILD_MAMBO_SUSFS: ${{ github.event.inputs.BUILD_MAMBO_SUSFS }}
        run: |
          python3 py/generate-matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, ensure-cache-release]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio
          pip install lxml

      - name: Restore ccache from release
        if: github.event.inputs.TEST == 'no' && github.event.inputs.TODO != 'defconfig'
        id: restore-ccache
        uses: ./.github/actions/ccache-restore
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_BRAND: ${{ vars.KERNEL_BRAND }}
          ANYKERNEL_REPO: ${{ vars.ANYKERNEL_REPO }}
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          KERNEL_SOURCE: ${{ github.event.inputs.KERNEL_SOURCE }}
          KERNEL_EXACT_VERSION: ${{ github.event.inputs.KERNEL_EXACT_VERSION }}
          ALLOW_UNVERIFIED: ${{ github.event.inputs.ALLOW_UNVERIFIED }}
          HYPERCORE_DEVICE: ${{ vars.HYPERCORE_DEVICE }}
          ALLOW_SKIPPED_PATCHES: ${{ vars.ALLOW_SKIPPED_PATCHES }}
          KSU: ${{ matrix.KSU }}
          KSU_COMPAT: ${{ matrix.KSU_COMPAT }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          C_LTO: ${{ matrix.C_LTO }}
          No_DS: ${{ matrix.No_DS }}
          TODO: ${{ inputs.TODO }}
          TEST: ${{ inputs.TEST }}
          LTO: ${{ inputs.LTO }}
          CLEAN_LTO_CACHE: ${{ inputs.CLEAN_LTO_CACHE }}
          DROIDSPACES: ${{ inputs.DROIDSPACES }}
          NH: ${{ inputs.NH }}
          NM: ${{ inputs.NM }}
          MM: ${{ inputs.MM }}
          GITHUB_TOKEN: ${{ github.token }}
          BSU_REF: ${{ vars.BSU_REF }}
          SUSFS_COMMIT: ${{ vars.SUSFS_COMMIT }}
          BSU_ALLOW_SUSFS_MISMATCH: ${{ vars.BSU_ALLOW_SUSFS_MISMATCH }}
          KSUN_REF: ${{ vars.KSUN_REF }}
          FINA_REF: ${{ vars.FINA_REF }}
          SKSU_REPO: ${{ vars.SKSU_REPO || 'SukiSU-Ultra/SukiSU-Ultra' }}
          SKSU_REF: ${{ vars.SKSU_REF || 'builtin' }}
          KOWSU_REPO: ${{ vars.KOWSU_REPO || 'KOWX712/KernelSU' }}
          KOWSU_REF: ${{ vars.KOWSU_REF || 'master' }}
          RKSU_REPO: ${{ vars.RKSU_REPO }}
          RKSU_REF: ${{ vars.RKSU_REF || 'main' }}
          MAMBOSU_REPO: ${{ vars.MAMBOSU_REPO }}
          MAMBOSU_REF: ${{ vars.MAMBOSU_REF || 'main' }}
          KSUN_REPO: ${{ vars.KSUN_REPO }}
          ZSTD: ${{ inputs.ZSTD }}
          LZ4KD: ${{ inputs.LZ4KD }}
          REKERNEL: ${{ inputs.REKERNEL }}
          BUILD_NAME: ${{ matrix.name }}
          RUN_NUM: -r${{ github.run_number }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Create KernelSU module for wireless modules
        if: ${{ inputs.NH }}
        run: |
          echo "Extracting wireless modules..."
          NAME="WirelessKSU"
          WKSU="modules/$NAME"
          RPWD=$(pwd)
          mkdir -p "$WKSU/lkm"
          mkdir -p "$WKSU/system/etc/firmware/rtw88"

          for mod in rfkill cfg80211 mac80211 'rtw88*' r8188eu libarc4; do
            found=$(find out/ -iname "${mod}.ko" 2>/dev/null)
            if [ -n "$found" ]; then
              echo "$found" | xargs -I{} cp {} "$WKSU/lkm/"
            else
              echo "[-] $mod: no .ko found (not built or built-in)"
            fi
          done

          if [ -n "$(ls -A "$WKSU/lkm" 2>/dev/null)" ]; then
            sed -i "s/version=.*/version=${{ env.RELEASE }}-${{ matrix.kernel_version }}-${{ env.VARIANT }}/" "$WKSU/module.prop"
            cp ksrc/drivers/net/wireless/realtek/rtw88/firmware/* "$WKSU/system/etc/firmware/rtw88" 2>/dev/null || echo "[-] rtw88 firmware not found, skipping"
            echo "Modules found:"
            ls -la "$WKSU/lkm/"
            mkdir -p artifacts
            cd "$WKSU"
            zip -9 -r "$RPWD/artifacts/$NAME-${{ matrix.kernel_version }}-${{ env.VARIANT }}-${{ env.RELEASE }}.zip" .
            echo "$NAME-${{ matrix.kernel_version }}-${{ env.VARIANT }}-${{ env.RELEASE }}.zip created"
          else
            echo "No .ko files found (drivers may be built-in for this kernel version)"
          fi

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats

      - name: Save ccache to release
        if: always() && github.event.inputs.TEST == 'no' && github.event.inputs.TODO != 'defconfig'
        uses: ./.github/actions/ccache-save
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Save environment for release
        if: always()
        run: |
          cat > build-env-${{ matrix.name }}.txt << EOF
          RELEASE_REPO=${{ env.RELEASE_REPO }}
          KERNEL_NAME=${{ env.KERNEL_NAME }}
          RELEASE_NAME=${{ env.RELEASE_NAME }}
          RELEASE=${{ env.RELEASE }}
          LINUX_VERSION=${{ env.LINUX_VERSION }}
          COMPILER_STRING=${{ env.COMPILER_STRING }}
          SUSFS_VERSION=${{ env.SUSFS_VERSION }}
          BASE_NAME=${{ env.BASE_NAME }}
          KSU=${{ matrix.KSU }}
          KSU_SUSFS=${{ matrix.KSU_SUSFS }}
          KERNEL_VERSION=${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE=${{ env.ANDROID_RELEASE }}
          KERNEL_SOURCE_REPO=${{ env.KERNEL_SOURCE_REPO }}
          KERNEL_SOURCE_BRANCH=${{ env.KERNEL_SOURCE_BRANCH }}
          KERNEL_COMMIT=${{ env.KERNEL_COMMIT }}
          KERNEL_SOURCE_URL=${{ env.KERNEL_SOURCE_URL }}
          KERNEL_TAG=${{ env.KERNEL_TAG }}
          KERNEL_EXACT_REQUESTED=${{ env.KERNEL_EXACT_REQUESTED }}
          SUSFS_COMMIT_USED=${{ env.SUSFS_COMMIT_USED }}
          EOF

          echo "BUILD_VARIANT=${{ matrix.name }}" >> build-env-${{ matrix.name }}.txt
          echo "Saved environment for ${{ matrix.name }}"

          if find . -name "*.rej" -type f | grep -q .; then
          mkdir -p rejected-patches-${{ matrix.name }}
          find . -name "*.rej" -type f -exec sh -c 'cp "$1" "rejected-patches-${{ matrix.name }}/$(echo "$1" | sed "s|^\./||; s|/|_|g")"' _ {} \;
          echo "Found $(find rejected-patches-${{ matrix.name }} -type f | wc -l) rejected patch files"
          else
            echo "No rejected patches found for ${{ matrix.name }}"
          fi

      - name: Upload environment file
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-env-${{ matrix.name }}-${{ github.run_number }}
          path: |
            build-env-${{ matrix.name }}.txt
            rejected-patches-${{ matrix.name }}/
          retention-days: 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-${{ matrix.name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1

  upload-all:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: all-builds-${{ github.run_number }}
          retention-days: 7
          path: |
            downloaded-artifacts/*.txt
            downloaded-artifacts/*.zip

  release:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' && github.event.inputs.TODO != 'defconfig' }}
    runs-on: ubuntu-latest
    env:
      TG_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        id: sums
        run: |
          cd release-artifacts
          shopt -s nullglob
          zips=( *.zip )
          if (( ${#zips[@]} == 0 )); then
            # GitHub rejects empty release assets, so there is nothing to publish
            echo "::warning::No ZIP artifacts were produced, so no release will be created. Check the failed build jobs."
            echo "has_zips=false" >> "$GITHUB_OUTPUT"
          else
            sha256sum "${zips[@]}" > checksums.txt
            md5sum "${zips[@]}" > checksums-md5.txt
            echo "has_zips=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load environment from builds and prepare release body
        env:
          TEST_INPUT: ${{ inputs.TEST }}
          DROIDSPACES_INPUT: ${{ inputs.DROIDSPACES }}
          NH_INPUT: ${{ inputs.NH }}
          NM_INPUT: ${{ inputs.NM }}
          LTO_INPUT: ${{ inputs.LTO }}
        run: python3 .github/scripts/prepare_release.py

      - name: Upload All Builds to release repo
        if: steps.sums.outputs.has_zips == 'true'
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE }}
          prerelease: true
          files: |
            release-artifacts/*.zip
            release-artifacts/checksums.txt
            release-artifacts/checksums-md5.txt
          body_path: release_body.md

      - name: Post to Telegram
        if: ${{ always() && env.TG_BOT_TOKEN != '' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
          RELEASE_URL: ${{ steps.sums.outputs.has_zips == 'true' && format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, env.RELEASE) || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          KERNEL_VERSIONS: ${{ env.KERNEL_VERSIONS }}
          KERNEL_VERSION: ${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE: ${{ env.ANDROID_RELEASE }}
        run: python3 .github/scripts/telegram_release.py
