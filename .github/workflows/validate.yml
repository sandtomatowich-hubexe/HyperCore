name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate workflows, scripts, source registry and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate GitHub workflows
        run: python3 .github/scripts/validate_workflows.py

      - name: Validate shell scripts
        run: python3 .github/scripts/validate_shell.py

      - name: Validate Python syntax
        run: python3 .github/scripts/validate_python.py

      - name: Validate referenced helper scripts exist
        run: python3 .github/scripts/validate_references.py

      - name: Validate workflow job graph, inputs and outputs
        run: python3 .github/scripts/validate_workflow_graph.py

      - name: Validate the kernel source registry
        run: python3 py/sources.py validate

      - name: Run the tests (registry, gate, pins, workflow, backward compatibility)
        run: bash tests/run_all.sh
